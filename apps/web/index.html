<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>SECAI-PT · 破阵</title>
  </head>
  <body>
    <script>
      // 主题预引导：首帧渲染前按持久化模式（light/dark/system）写
      // data-secai-dark，避免亮暗闪跳（key 与 theme/theme.ts 同源）。
      ;(() => {
        let stored = null
        try {
          stored = localStorage.getItem('secai-theme-mode')
        } catch (e) { /* 隐私模式等场景忽略 */ }
        const dark =
          stored === 'dark'
            ? true
            : stored === 'light'
              ? false
              : typeof matchMedia !== 'undefined' &&
                matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.body.toggleAttribute('data-secai-dark', dark)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
