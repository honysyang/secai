name: "slither"
command: "slither"
enabled: true
short_description: "Solidity 静态分析框架，检测智能合约漏洞"
description: |
  Slither 是 Solidity 静态分析框架，自动检测智能合约常见漏洞（重入、访问控制、整数溢出等）。

  **主要功能：**
  - 自动检测 SWC 漏洞类
  - 输出 JSON 报告
  - 支持 Solidity 源码与已编译字节码

  **使用场景：**
  - 智能合约安全审计
  - 重入/访问控制/整数溢出检测
parameters:
  - name: "target"
    type: "string"
    description: "Solidity 合约文件路径或目录"
    required: true
    position: 0
    format: "positional"
  - name: "json"
    type: "bool"
    description: "输出 JSON 格式报告（设为 true 启用）"
    required: false
    flag: "--json"
    format: "flag"
  - name: "filter"
    type: "string"
    description: "按漏洞检测器过滤（逗号分隔，如 reentrancy-eth,arbitrary-send）"
    required: false
    flag: "--filter"
    format: "flag"
